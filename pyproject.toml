[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gemini-media-generation"
version = "0.1.0"
description = "Google Gemini image and video generation backends for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "bytecakelake" }]
dependencies = ["google-genai>=2.33,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY); deselected by default"]
addopts = "-m 'not live'"
